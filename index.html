<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ペンギン図鑑</title>

  <style>
  body {
    font-family: sans-serif;
    background-color: #eaf7ff;
    color: #17324d;
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px;
    line-height: 1.8;
  }

  h1 {
    text-align: center;
    color: darkorange;
  }

  h2 {
    border-bottom: 2px solid #8bd3ed;
    padding-bottom: 8px;
    margin-top: 32px;
  }

  ul {
    background-color: white;
    border-radius: 12px;
    padding: 20px 20px 20px 40px;
  }
  img {
  display: block;
  width: 100%;
  max-width: 480px;
  height: auto;
  border-radius: 12px;
  margin: 20px auto;
  }
</style>
</head>
<body>
  <h1>ペンギン図鑑</h1>
  <p>ペンギンはのんびり歩いたり、何を考えているかわからないような姿が可愛い!</p>
	
  <h2>コウテイペンギン</h2>
　<img src="images/emperpenguin.jpg" alt="コウテイペンギンの写真">
  <p>私が気になっているペンギンです。これから特徴を調べて紹介します。</p>

  <h2>このページで紹介したいこと</h2>
  <ul>
    <li>ペンギンの種類</li>
    <li>暮らしている場所</li>
    <li>好きな食べ物</li>
  </ul>
 <h2>ペンギンからのメッセージ</h2>

 <button id="penguin-button" type="button">ペンギンに話しかける</button>
 <p id="penguin-message" aria-live="polite">ここに返事が表示されます。</p>

 <script>
  const button = document.getElementById("penguin-button");
  const message = document.getElementById("penguin-message");

  button.addEventListener("click", function () {
    message.textContent = "こんにちは！ ペンギンの歴史へようこそ！";
  });
 </script>
　<h2>ペンギンクイズ</h2>

<p id="quiz-progress"></p>
<p id="quiz-question"></p>

<button type="button" id="answer-a"></button>
<button type="button" id="answer-b"></button>

<p id="quiz-result" aria-live="polite"></p>

<button type="button" id="next-question" hidden>次の問題へ</button>
<button type="button" id="restart-quiz" hidden>もう一度挑戦する</button>

<script>
  // 配列：3問のデータを順番にまとめます
  const questions = [
    {
      question: "ペンギンは、どちらの仲間でしょう？",
      choices: ["鳥の仲間", "魚の仲間"],
      correct: 0
    },
    {
      question: "ペンギンの体を覆っているのは？",
      choices: ["うろこ", "羽毛"],
      correct: 1
    },
    {
      question: "ペンギンの呼吸に必要なのは？",
      choices: ["水中のえら呼吸", "水面に出て空気を吸うこと"],
      correct: 1
    }
  ];

  // 変数：今の問題番号と正解数を覚えます
  let currentQuestion = 0;
  let score = 0;

  const progress = document.getElementById("quiz-progress");
  const questionText = document.getElementById("quiz-question");
  const answerA = document.getElementById("answer-a");
  const answerB = document.getElementById("answer-b");
  const result = document.getElementById("quiz-result");
  const nextButton = document.getElementById("next-question");
  const restartButton = document.getElementById("restart-quiz");

  // 今の問題を画面に表示します
  function showQuestion() {
    const quiz = questions[currentQuestion];

    progress.textContent =
      (currentQuestion + 1) + " / " + questions.length + " 問目";

    questionText.textContent = quiz.question;
    answerA.textContent = quiz.choices[0];
    answerB.textContent = quiz.choices[1];

    answerA.hidden = false;
    answerB.hidden = false;
    answerA.disabled = false;
    answerB.disabled = false;

    result.textContent = "";
    nextButton.hidden = true;
    restartButton.hidden = true;
  }

  // 選んだ答えを判定します
  function checkAnswer(selectedAnswer) {
    const quiz = questions[currentQuestion];

    // 同じ問題で何度も回答できないようにします
    answerA.disabled = true;
    answerB.disabled = true;

    if (selectedAnswer === quiz.correct) {
      score = score + 1;
      result.textContent = "正解！🐧";
      result.style.color = "green";
    } else {
      result.textContent =
        "残念！ 正解は「" + quiz.choices[quiz.correct] + "」です。";
      result.style.color = "red";
    }

    nextButton.textContent =
      currentQuestion === questions.length - 1
        ? "結果を見る"
        : "次の問題へ";

    nextButton.hidden = false;
  }

  answerA.addEventListener("click", function () {
    checkAnswer(0);
  });

  answerB.addEventListener("click", function () {
    checkAnswer(1);
  });

  nextButton.addEventListener("click", function () {
    currentQuestion = currentQuestion + 1;

    if (currentQuestion < questions.length) {
      showQuestion();
    } else {
      progress.textContent = "クイズ終了！";
      questionText.textContent =
        questions.length + "問中、" + score + "問正解でした！🐧";

      answerA.hidden = true;
      answerB.hidden = true;
      nextButton.hidden = true;
      result.textContent = "";
      restartButton.hidden = false;
    }
  });

  restartButton.addEventListener("click", function () {
    currentQuestion = 0;
    score = 0;
    showQuestion();
  });

  // ページを開いたら最初の問題を表示します
  showQuestion();
</script>
</script>
</body>
</html>
